name: Publish Playmancer Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

# No publication from pull-request heads or unreviewed branches.
permissions: {}

concurrency:
  group: playmancer-pages-master
  cancel-in-progress: false

jobs:
  verify-and-package:
    if: github.ref == 'refs/heads/master'
    name: Verify and package exact master
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # The default runner's apt mirror stalled this job for 11+ minutes on
    # 2026-10-27 before browser navigation; use the known-good pinned image
    # with Chromium and OS libraries already installed (as in Verify).
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node correctness suite
        run: npm test
      - name: Build static player
        run: npm run build
      - name: Check public static payload
        run: python3 scripts/pages-preflight.py _site
      - name: Compare two independently built payloads
        run: |
          node scripts/build-demo.mjs /tmp/playmancer-pages-a --catalog examples/catalog.multistore-30.real.json
          node scripts/build-demo.mjs /tmp/playmancer-pages-b --catalog examples/catalog.multistore-30.real.json
          cmp _site/index.html /tmp/playmancer-pages-a/index.html
          cmp _site/index.html /tmp/playmancer-pages-b/index.html
          cmp _site/.nojekyll /tmp/playmancer-pages-a/.nojekyll
          cmp _site/.nojekyll /tmp/playmancer-pages-b/.nojekyll
      # The container's Python has working SSL and its Chromium binary is
      # preinstalled; setup-python and `playwright install --with-deps` are
      # unnecessary (and the latter can hang on a slow Ubuntu apt mirror).
      - name: Install matching Playwright Python client
        run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Run offline Chromium player flow
        run: python scripts/browser-smoke.py
      # The legacy smoke harness intentionally rebuilds _site with synthetic fixtures.
      # Restore the independently checked real catalog before artifact upload.
      - name: Restore and verify the real-game Pages payload after synthetic smoke
        run: |
          npm run build
          python3 scripts/pages-preflight.py _site
      - name: Upload verified Pages payload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    if: github.ref == 'refs/heads/master'
    name: Deploy verified master to Pages
    timeout-minutes: 10
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires Pages to have been provisioned with GitHub Actions as source.
      # Intentionally does NOT attempt to bypass missing repository admin rights.
      - name: Verify Pages configuration
        id: pages_config
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Explain missing Pages setup without hiding the failure
        if: ${{ failure() && steps.pages_config.outcome == 'failure' }}
        run: |
          {
            echo "### Playmancer Pages configuration failed"
            echo ""
            echo "The verified static artifact was built and uploaded successfully, but GitHub Pages could not be configured."
            echo "If the error is HTTP 404, a repository admin or maintainer must open"
            echo "[Settings → Pages](https://github.com/drevendev/Playmancer/settings/pages)"
            echo "and select **GitHub Actions** under **Build and deployment → Source**."
            echo 'Then rerun **Publish Playmancer Pages** on `master`.'
            echo "Do not claim a live URL until the publish and public HTTP checks pass."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Pages configuration required::Inspect the configure-pages error; for HTTP 404 enable GitHub Actions in repository Settings > Pages, then rerun."
      - name: Publish reviewed static artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages revision and same-origin Bridge worker
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_URL" != https://* ]]; then
            echo "::error title=Missing Pages URL::deploy-pages returned no HTTPS page_url"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 "$DEPLOY_URL" -o /tmp/playmancer-live-index.html \
              && grep -Fq "name=\"playmancer-revision\" content=\"$EXPECTED_SHA\"" /tmp/playmancer-live-index.html \
              && curl --fail --silent --show-error --location --max-time 15 "${DEPLOY_URL%/}/bridge-worker.js" -o /tmp/playmancer-live-worker.js \
              && grep -Fq "self.onmessage =" /tmp/playmancer-live-worker.js; then
              printf '### Live Pages verified\n\n- URL: %s\n- Revision: `%s`\n- Same-origin worker: HTTP 200 and expected entry point\n' "$DEPLOY_URL" "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
              echo "Live Pages index and worker verified at $EXPECTED_SHA"
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 10; fi
          done
          echo "::error title=Pages live check failed::Expected revision or same-origin bridge-worker.js was not served after deploy"
          exit 1

  hosted-player-acceptance:
    if: github.ref == 'refs/heads/master'
    name: Exercise public Pages in desktop and mobile browsers
    needs: publish
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The pinned image already contains Chromium, Firefox, WebKit and OS libraries.
    # Installing browser system dependencies through the runner's apt mirror
    # previously exceeded the job timeout before player acceptance could begin.
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The pinned container ships working Python SSL and compatible browsers.
      # Avoid replacing it with setup-python's runner toolcache interpreter.
      - name: Install matching Playwright Python client
        run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Navigate deployed Pages and verify the exact revision and player journey
        env:
          # Firefox requires an owned HOME inside this root-run container.
          HOME: /root
          PLAYMANCER_HOSTED_URL: ${{ needs.publish.outputs.page_url }}
          PLAYMANCER_EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/browser-http-acceptance.py
      - name: Retain real hosted desktop/mobile screenshots and assertion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-browser-${{ github.sha }}
          path: |
            .test-artifacts/http-cross-browser.json
            .test-artifacts/http-*-desktop.png
            .test-artifacts/http-*-mobile.png
            .test-artifacts/http-*-text400.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
