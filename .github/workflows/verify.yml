name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests and deterministic build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Reject noncanonical hosted URLs and redirected workers
        run: python3 -m unittest discover -s test -p 'test_hosted_validation.py' -v
      - run: npm run validate:catalog
      - name: Verify reproducible five-method benchmark
        run: |
          node scripts/run-ranking-benchmark.mjs examples/benchmark.synthetic.json > /tmp/benchmark-a.json
          node scripts/run-ranking-benchmark.mjs examples/benchmark.synthetic.json > /tmp/benchmark-b.json
          cmp /tmp/benchmark-a.json /tmp/benchmark-b.json
      - run: npm run build
      - run: python3 scripts/pages-preflight.py _site
      - name: Verify byte-identical builds
        run: |
          rm -rf /tmp/playmancer-build-a /tmp/playmancer-build-b
          node scripts/build-demo.mjs /tmp/playmancer-build-a
          node scripts/build-demo.mjs /tmp/playmancer-build-b
          cmp /tmp/playmancer-build-a/index.html /tmp/playmancer-build-b/index.html
          cmp /tmp/playmancer-build-a/bridge-worker.js /tmp/playmancer-build-b/bridge-worker.js
          cmp /tmp/playmancer-build-a/.nojekyll /tmp/playmancer-build-b/.nojekyll

  browser:
    name: Chromium product flow
    runs-on: ubuntu-latest
    # Official Playwright image retains a browser-supported Noble runtime when
    # GitHub's ubuntu-latest host advances beyond Playwright 1.55 support.
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the Python build supplied by the Playwright image. setup-python's
      # host toolcache executable lacks the ssl extension inside this container.
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      # Chromium is bundled in the pinned container; no unsupported host apt install.
      - run: python scripts/browser-smoke.py
      - name: Verify Bridge discovery and share restoration
        run: python scripts/browser-bridge-acceptance.py
      - name: Verify alternative catalog player journey
        run: python scripts/browser-catalog-acceptance.py
      - name: Verify opt-in Wikidata CC0 real catalog basket and Bridge
        run: python scripts/browser-real-catalog-acceptance.py
      - name: Retain actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ github.sha }}
          path: |
            .test-artifacts/*.png
            .test-artifacts/*.json
            .test-artifacts/catalog-site/index.html
            .test-artifacts/catalog-site/.nojekyll
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14


  cross_browser_http:
    name: Local HTTP multi-engine player journey
    runs-on: ubuntu-latest
    # Browser binaries and OS libraries are preinstalled. The runner's slow
    # apt mirror cancelled two prior exact-head HTTP suites before any test ran.
    # Match the pip Playwright version below to the pinned official image.
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the Python build supplied by the Playwright image. setup-python's
      # host toolcache executable lacks the ssl extension inside this container.
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Exercise basket, Bridge and share via actual local HTTP navigation
        # The official Playwright image runs this step as root, but Actions mounts
        # /github/home owned by pwuser. Firefox requires $HOME owned by the user.
        env:
          HOME: /root
        run: python scripts/browser-http-acceptance.py
      - name: Retain HTTP screenshots and per-engine results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-http-${{ github.sha }}
          path: |
            .test-artifacts/http-*.png
            .test-artifacts/http-cross-browser.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  bridge_perf:
    name: Synthetic Bridge browser responsiveness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the Python build supplied by the Playwright image. setup-python's
      # host toolcache executable lacks the ssl extension inside this container.
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      # Chromium is bundled in the pinned container; no unsupported host apt install.
      - name: Measure 12/50/250 dense, sparse and disconnected synthetic Bridge routes at 1x/4x CPU
        run: python scripts/browser-bridge-performance.py
      - name: Verify cancellable Bridge worker on 250 fictional profiles over HTTP
        run: python scripts/browser-bridge-worker-acceptance.py
      - name: Retain exact-head latency samples and Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-performance-${{ github.sha }}
          path: |
            .test-artifacts/bridge-performance.json
            .test-artifacts/bridge-perf-*.png
            .test-artifacts/bridge-worker-http.json
            .test-artifacts/bridge-worker-*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
