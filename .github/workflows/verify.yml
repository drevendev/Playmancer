name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests and deterministic build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Reject noncanonical hosted URLs and redirected workers
        run: python3 -m unittest discover -s test -p 'test_hosted_validation.py' -v
      - name: Test public Pages diagnostic probe and bounded retry
        run: python3 -m unittest discover -s test -p 'test_pages_live_probe.py' -v
      - name: Test native GitHub Pages publisher sequencing gate
        run: python3 -m unittest discover -s test -p 'test_pages_native_publisher_gate.py' -v
      - run: npm run validate:catalog
      - name: Verify reproducible five-method benchmark
        run: |
          node scripts/run-ranking-benchmark.mjs examples/benchmark.synthetic.json > /tmp/benchmark-a.json
          node scripts/run-ranking-benchmark.mjs examples/benchmark.synthetic.json > /tmp/benchmark-b.json
          cmp /tmp/benchmark-a.json /tmp/benchmark-b.json
      - run: npm run build
      - run: python3 scripts/release-preflight.py _site
      - name: Verify byte-identical builds
        run: |
          rm -rf /tmp/playmancer-build-a /tmp/playmancer-build-b
          node scripts/build-demo.mjs /tmp/playmancer-build-a
          node scripts/build-demo.mjs /tmp/playmancer-build-b
          cmp /tmp/playmancer-build-a/index.html /tmp/playmancer-build-b/index.html
          cmp /tmp/playmancer-build-a/bridge-worker.js /tmp/playmancer-build-b/bridge-worker.js
          cmp /tmp/playmancer-build-a/player.css /tmp/playmancer-build-b/player.css
          cmp /tmp/playmancer-build-a/.nojekyll /tmp/playmancer-build-b/.nojekyll

  browser:
    name: Chromium product flow
    runs-on: ubuntu-latest
    # Official Playwright image retains a browser-supported Noble runtime when
    # GitHub's ubuntu-latest host advances beyond Playwright 1.55 support.
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the Python build supplied by the Playwright image. setup-python's
      # host toolcache executable lacks the ssl extension inside this container.
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      # Chromium is bundled in the pinned container; no unsupported host apt install.
      - run: python scripts/browser-smoke.py
      - name: Verify Bridge discovery and share restoration
        run: python scripts/browser-bridge-acceptance.py
      - name: Verify alternative catalog player journey
        run: python scripts/browser-catalog-acceptance.py
      - name: Verify opt-in Wikidata CC0 real catalog basket and Bridge
        run: python scripts/browser-real-catalog-acceptance.py
      - name: Exercise 1,000-profile synthetic catalog discovery and share restoration
        run: python scripts/browser-large-catalog-acceptance.py
      - name: Exercise bounded Gameplay Facts on the validated sparse release fixture
        env:
          PLAYMANCER_SCALE_BROWSER: "1"
        run: node --test test/sparse-release-scale.test.js
      - name: Retain actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ github.sha }}
          path: |
            .test-artifacts/*.png
            .test-artifacts/*.json
            .test-artifacts/catalog-site/index.html
            .test-artifacts/catalog-site/player.css
            .test-artifacts/catalog-site/.nojekyll
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14


  cross_browser_http:
    name: Local HTTP multi-engine player journey
    runs-on: ubuntu-latest
    # Browser binaries and OS libraries are preinstalled. The runner's slow
    # apt mirror cancelled two prior exact-head HTTP suites before any test ran.
    # Match the pip Playwright version below to the pinned official image.
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the Python build supplied by the Playwright image. setup-python's
      # host toolcache executable lacks the ssl extension inside this container.
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Exercise basket, Bridge and share via actual local HTTP navigation
        # The official Playwright image runs this step as root, but Actions mounts
        # /github/home owned by pwuser. Firefox requires $HOME owned by the user.
        env:
          HOME: /root
        run: |
          python scripts/browser-http-acceptance.py
          if ! python scripts/browser-observations-acceptance.py --engine all; then
            # Compare the previously accepted revision in the same Firefox image.
            # A baseline pass must never turn a failed current-head run green.
            baseline=c770935bb05ee416e01a7b2e59800962bb85caea
            if git fetch --no-tags --depth=1 origin "$baseline" && git worktree add --detach /tmp/playmancer-observation-baseline "$baseline"; then
              cp scripts/browser-observations-acceptance.py /tmp/playmancer-observation-baseline/scripts/browser-observations-acceptance.py
              echo "Diagnostic baseline: $baseline"
              (cd /tmp/playmancer-observation-baseline && python scripts/browser-observations-acceptance.py --engine firefox) || true
              cp /tmp/playmancer-observation-baseline/.test-artifacts/observations-browser.json .test-artifacts/observations-baseline-browser.json || true
              for screenshot in /tmp/playmancer-observation-baseline/.test-artifacts/observations-compare-failure-*.png; do
                if [ -f "$screenshot" ]; then cp "$screenshot" ".test-artifacts/observations-baseline-$(basename "$screenshot")"; fi
              done
            fi
            exit 1
          fi
      - name: Measure compact favorites against exact previous release
        env:
          HOME: /root
        run: |
          baseline=a303d1379fee10c79e165fcdd2ce4438dd185677
          git fetch --no-tags --depth=1 origin "$baseline"
          git worktree add --detach /tmp/playmancer-compact-baseline "$baseline"
          (cd /tmp/playmancer-compact-baseline && PLAYMANCER_REVISION="$baseline" npm run build)
          python scripts/browser-compact-basket-acceptance.py /tmp/playmancer-compact-baseline/_site
      - name: Compare historical 35-game Firefox focus in the same image
        if: ${{ !cancelled() }}
        env:
          HOME: /root
          PLAYMANCER_BROWSERS: firefox
          PLAYMANCER_EXPECTED_CATALOG_COUNT: "35"
          PLAYMANCER_HTTP_SITE: _site-focus35
          PLAYMANCER_HTTP_ARTIFACTS: .test-artifacts/focus35
        run: |
          node scripts/build-release.mjs _site-focus35 --candidate-35
          python scripts/release-preflight.py _site-focus35 --candidate-35
          python scripts/browser-http-acceptance.py
      - name: Retain HTTP screenshots and per-engine results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-http-${{ github.sha }}
          path: |
            .test-artifacts/http-*.png
            .test-artifacts/http-cross-browser.json
            .test-artifacts/compact-basket-*.png
            .test-artifacts/compact-basket-geometry.json
            .test-artifacts/focus35/http-cross-browser.json
            .test-artifacts/focus35/http-*.png
            .test-artifacts/observations-*.png
            .test-artifacts/observations-browser.json
            .test-artifacts/observations-baseline-browser.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  bridge_perf:
    name: Synthetic Bridge browser responsiveness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the Python build supplied by the Playwright image. setup-python's
      # host toolcache executable lacks the ssl extension inside this container.
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      # Chromium is bundled in the pinned container; no unsupported host apt install.
      - name: Measure 12/50/250 dense, sparse and disconnected synthetic Bridge routes at 1x/4x CPU
        run: python scripts/browser-bridge-performance.py
      - name: Verify cancellable Bridge worker on 250 fictional profiles over HTTP
        run: python scripts/browser-bridge-worker-acceptance.py
      - name: Retain exact-head latency samples and Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-performance-${{ github.sha }}
          path: |
            .test-artifacts/bridge-performance.json
            .test-artifacts/bridge-perf-*.png
            .test-artifacts/bridge-worker-http.json
            .test-artifacts/bridge-worker-*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
